name: Backend CI

on:
  push:
    branches: [dev, main]
    paths: ['backend/**']
  pull_request:
    branches: [dev]
    paths: ['backend/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      # --max-warnings=9999 means warnings never fail CI, only errors do
      - run: npm run lint -- --max-warnings=9999
