name: Vendor Web CI

on:
  push:
    branches: [dev, main]
    paths: ['vendor-web/**']
  pull_request:
    branches: [dev]
    paths: ['vendor-web/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
