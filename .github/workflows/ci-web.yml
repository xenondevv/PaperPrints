name: Vendor Web CI

on:
  push:
    branches: [dev, main]
    paths: ['vendor-web/**']
  pull_request:
    branches: [dev]
    paths: ['vendor-web/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: vendor-web/package-lock.json
      - run: cd vendor-web && npm ci
      - run: cd vendor-web && npm run build
      - run: cd vendor-web && npm run lint
