name: CI — Mobile Apps

on:
  push:
    branches: [dev, main]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'
  pull_request:
    branches: [dev]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'

jobs:
  lint-user-app:
    name: Lint User App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true
      - working-directory: user-app
        run: flutter pub get
      # Only fail on errors, not warnings/infos
      - working-directory: user-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  lint-vendor-app:
    name: Lint Vendor App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — vendor app not yet initialized
        run: echo "Vendor app scaffold not yet created. Skipping."
