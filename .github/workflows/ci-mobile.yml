name: CI — Mobile Apps

on:
  push:
    branches: [dev, main]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'
  pull_request:
    branches: [dev]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'

jobs:
  lint-user-app:
    name: Lint User App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  lint-vendor-app:
    name: Lint Vendor App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check if package.json has dependencies
        id: check
        run: |
          if [ -f package-lock.json ] || jq -e '.dependencies // empty' package.json > /dev/null 2>&1; then
            echo "has_deps=true" >> $GITHUB_OUTPUT
          else
            echo "has_deps=false" >> $GITHUB_OUTPUT
          fi
      - name: Skip — no dependencies to lint
        if: steps.check.outputs.has_deps == 'false'
        run: echo "Vendor app has no dependencies yet, skipping lint."
