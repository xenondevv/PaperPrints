name: CI — Mobile Apps

on:
  push:
    branches: [dev, main]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'
  pull_request:
    branches: [dev]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'

jobs:
  lint-user-app:
    name: Lint User App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: user-app/package.json
      - run: npm ci
      - run: npm run lint

  lint-vendor-app:
    name: Lint Vendor App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vendor-app/package.json
      - run: npm ci
      - run: npm run lint
