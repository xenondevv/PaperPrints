name: CI — Mobile Apps

on:
  push:
    branches: [dev, main]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'
  pull_request:
    branches: [dev]
    paths:
      - 'user-app/**'
      - 'vendor-app/**'

jobs:
  lint-user-app:
    name: Lint User App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        working-directory: user-app
        run: flutter pub get
      - name: Analyze
        working-directory: user-app
        run: flutter analyze

  lint-vendor-app:
    name: Lint Vendor App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — vendor app not yet initialized
        run: echo "Vendor app has no dependencies yet, skipping lint."
