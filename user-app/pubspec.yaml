name: paper_prints_user
description: "Paper Prints — Customer Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase & Google Auth
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # File picking
  file_picker: ^8.3.7

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # PDF rendering (local page count + thumbnails)
  pdfx: ^2.8.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # UI utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
